  </defs>
  <!-- Circle background -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" opacity="0.9"/>
  <!-- Cross/Plus symbol -->
  <rect x="28" y="14" width="8" height="36" rx="4" fill="white"/>
  <rect x="14" y="28" width="36" height="8" rx="4" fill="white"/>
  <!-- Signal rings -->
  <path d="M12 12 C12 12, 8 20, 8 32 C8 44, 12 52, 12 52" stroke="url(#pulse)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M52 12 C52 12, 56 20, 56 32 C56 44, 52 52, 52 52" stroke="url(#pulse)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
